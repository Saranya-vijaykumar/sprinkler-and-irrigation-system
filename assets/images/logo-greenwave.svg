    <path d="M24 6C24 6 10.5 19 10.5 31C10.5 38 16 45 24 45C24 34.5 30.5 24.5 37 19.5C32 13 24 6 24 6Z" fill="url(#gwLeafGradModern)"/>
    <path d="M24 16C23 26 18 35 15 39" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.95"/>
    <circle cx="31" cy="33" r="2.2" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Modern Two-Tone Typography -->
  <text x="64" y="33" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#162829">Green</tspan><tspan fill="#AB6937">Wave</tspan>
  </text>
  <text x="65" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#1E4445">
