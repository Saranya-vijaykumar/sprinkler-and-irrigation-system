<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 60" width="290" height="60" fill="none">
  <defs>
    <linearGradient id="gwDropGradModern" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#EBA328"/>
      <stop offset="50%" stop-color="#AB6937"/>
      <stop offset="100%" stop-color="#1E4445"/>
    </linearGradient>
    <linearGradient id="gwLeafGradModern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C2B3"/>
      <stop offset="50%" stop-color="#AB6937"/>
      <stop offset="100%" stop-color="#1E4445"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#AB6937" flood-opacity="0.25"/>
